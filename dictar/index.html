<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dictar · Mesa de trabajo JL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--ground:#1b1b1a;--surface:#232322;--line:#3a3a37;--ink:#E2E3D0;--ink-2:#b9baa8;--ink-3:#8c8d7e;--accent:#fa8a1a;--bad:#f0604d;--ok:#8fbf7a;--grad:linear-gradient(135deg,#fa8a1a,#e4341f)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 "Figtree",system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;min-height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:18px}
.kicker{font:700 11px/1 "Montserrat",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font:800 21px/1.3 "Montserrat",sans-serif;margin:6px 0 0;text-wrap:balance}
.mic-row{display:grid;justify-items:center;gap:10px;padding-block:6px}
#mic{all:unset;cursor:pointer;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);transition:transform .15s,border-color .15s}
#mic svg{width:40px;height:40px;fill:var(--ink)}
#mic:hover{border-color:var(--accent)}
#mic:focus-visible{outline:3px solid #EAAA28;outline-offset:4px}
#mic.on{background:var(--grad);border-color:transparent;animation:pulse 1.4s ease-in-out infinite}
#mic.on svg{fill:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,138,26,.45)}50%{box-shadow:0 0 0 16px rgba(250,138,26,0)}}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
#status{font-size:14px;color:var(--ink-2);text-align:center;min-height:1.5em}
#status.err{color:var(--bad)}
textarea{width:100%;height:100%;min-height:180px;resize:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;font:400 17px/1.55 "Figtree",system-ui,sans-serif}
textarea:focus-visible{outline:2px solid #EAAA28;outline-offset:2px}
#interim{color:var(--ink-3);font-style:italic;font-size:15px;min-height:1.5em;margin-top:-10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button.b{all:unset;cursor:pointer;font:700 15px/1 "Montserrat",sans-serif;padding:14px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
button.b.primary{background:var(--grad);border-color:transparent;color:#fff;flex:1}
button.b:disabled{opacity:.45;cursor:default}
button.b:focus-visible{outline:2px solid #EAAA28;outline-offset:2px}
.done{display:grid;gap:10px;text-align:center;align-content:center}
.done b{font:800 22px "Montserrat",sans-serif}
</style>
</head>
<body>
<main id="app">
  <header>
    <div class="kicker">Dictar respuesta · Mesa de trabajo JL</div>
    <h1 id="title">Tu respuesta</h1>
  </header>
  <div class="mic-row">
    <button id="mic" type="button" aria-label="Empezar a dictar" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <div id="status" aria-live="polite">Toca el micrófono y habla. Puedes corregir el texto antes de enviarlo.</div>
  </div>
  <div style="display:grid;grid-template-rows:1fr auto;gap:14px;min-height:0">
    <textarea id="text" aria-label="Texto dictado" placeholder="Aquí aparece lo que dices…"></textarea>
    <div id="interim" aria-hidden="true"></div>
  </div>
  <div class="actions">
    <button class="b" type="button" id="clear">Borrar</button>
    <button class="b primary" type="button" id="send" disabled>Agregar a mi nota</button>
  </div>
</main>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const ITEM = q.get('i') || '', NONCE = q.get('n') || '';
  document.getElementById('title').textContent = q.get('t') || 'Tu respuesta';
  const $ = id => document.getElementById(id);
  const mic = $('mic'), status = $('status'), text = $('text'), interim = $('interim'), send = $('send');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, wantOn = false;

  function setStatus(t, err) { status.textContent = t; status.classList.toggle('err', !!err); }
  function syncSend() { send.disabled = !text.value.trim(); }
  text.addEventListener('input', syncSend);

  if (!SR) {
    mic.disabled = true;
    setStatus('Este navegador no tiene dictado. Ábrelo en Chrome, Edge o Safari; o escribe aquí.', true);
  } else {
    rec = new SR();
    rec.lang = 'es-CO';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onstart = () => { listening = true; mic.classList.add('on'); mic.setAttribute('aria-pressed', 'true'); mic.setAttribute('aria-label', 'Detener dictado'); setStatus('Escuchando… toca de nuevo para detener.'); };
    rec.onresult = e => {
      let tmp = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) {
          const t = r[0].transcript.trim();
          if (t) text.value = (text.value.trim() ? text.value.trim() + ' ' : '') + t.charAt(0).toUpperCase() + t.slice(1);
        } else tmp += r[0].transcript;
      }
      interim.textContent = tmp;
      syncSend();
    };
    rec.onerror = e => {
      const msg = {
        'not-allowed': 'No hay permiso para el micrófono. Actívalo en el candado de la barra de direcciones.',
        'service-not-allowed': 'El navegador no permite el dictado aquí.',
        'no-speech': 'No se escuchó nada. Toca el micrófono e inténtalo de nuevo.',
        'audio-capture': 'No se encontró un micrófono.',
        'network': 'Sin conexión: el dictado necesita internet.'
      }[e.error] || ('El dictado se detuvo (' + e.error + ').');
      if (e.error !== 'no-speech' && e.error !== 'aborted') wantOn = false;
      setStatus(msg, e.error !== 'no-speech');
    };
    rec.onend = () => {
      listening = false; interim.textContent = '';
      if (wantOn) { try { rec.start(); return; } catch (err) {} }
      mic.classList.remove('on'); mic.setAttribute('aria-pressed', 'false'); mic.setAttribute('aria-label', 'Empezar a dictar');
      if (!status.classList.contains('err')) setStatus(text.value.trim() ? 'Listo. Revisa el texto y agrégalo a tu nota.' : 'Toca el micrófono y habla.');
    };
    mic.addEventListener('click', () => {
      if (listening || wantOn) { wantOn = false; rec.stop(); return; }
      wantOn = true;
      try { rec.start(); } catch (err) { setStatus('No se pudo iniciar el dictado. Intenta de nuevo.', true); wantOn = false; }
    });
  }

  $('clear').addEventListener('click', () => { text.value = ''; interim.textContent = ''; syncSend(); text.focus(); });

  send.addEventListener('click', async () => {
    const value = text.value.trim();
    if (!value) return;
    if (rec && (listening || wantOn)) { wantOn = false; rec.stop(); }
    if (window.opener && ITEM && NONCE) {
      window.opener.postMessage({type: 'mesa-dictado', item: ITEM, nonce: NONCE, text: value}, '*');
      $('app').innerHTML = '<div class="done"><b>Listo</b><span>El texto quedó en tu nota. Ya puedes cerrar esta ventana.</span></div>';
      setTimeout(() => { try { window.close(); } catch (e) {} }, 900);
      return;
    }
    // Sin conexión con la mesa (por ejemplo, abierta aparte): se copia para pegarlo a mano.
    try { await navigator.clipboard.writeText(value); setStatus('No encontré la Mesa abierta. Copié el texto: pégalo en tu nota.'); }
    catch (e) { text.select(); setStatus('No encontré la Mesa abierta. Copia el texto y pégalo en tu nota.', true); }
  });
})();
</script>
</body>
</html>
