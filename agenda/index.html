<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mesa de trabajo JL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="login-css">
:root{color-scheme:dark;--ground:#1b1b1a;--surface:#232322;--line:#3a3a37;--ink:#E2E3D0;--ink-2:#b9baa8;--accent:#fa8a1a;--bad:#f0604d}
@media (prefers-color-scheme:light){:root{color-scheme:light;--ground:#f4f4ea;--surface:#fbfbf5;--line:#d6d6c6;--ink:#232322;--ink-2:#4a4a44;--accent:#DC4610;--bad:#c42b17}}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.6 Figtree,system-ui,sans-serif}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:16px}
.card h1{font:800 28px/1.1 Montserrat,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.card p{margin:0;color:var(--ink-2)}
.kick{font:600 12px/1 Montserrat,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.err{color:var(--bad);font-size:14.5px}
.btn{all:unset;cursor:pointer;font:700 14px/1 Montserrat,system-ui,sans-serif;padding:12px 16px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);text-align:center}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gbtn{min-height:44px}
</style></head>
<body>
<div class="gate" id="gate"><div class="card">
  <div class="kick">Juan Londoño · Inversionista</div>
  <h1 id="gate-title">Mesa de trabajo</h1>
  <p id="gate-msg">Entra con el correo de Google que le diste a Darío. No necesitas una cuenta nueva.</p>
  <div id="gbtn"></div>
  <div class="err" id="gate-err" role="alert"></div>
</div></div>
<script>
const BOARD='agenda', API='https://script.google.com/macros/s/AKfycbxpCoOxYEoGHbDG9ZkBTggU78TCW9Oj6byMI5Zu3BjyP5gQdbTXloKsCOc5i6R9IVVlJQ/exec', CLIENT_ID='4732553757-o1gh0f8paqaa2uqv8ugmn42qk675677s.apps.googleusercontent.com';
let TOKEN=null, started=false, resolveLogin=null;
const $=id=>document.getElementById(id);
function showGate(msg){ $('gate').hidden=false; if(msg) $('gate-err').textContent=msg; }

// POST de texto plano: no dispara permisos previos del navegador y Apps Script lo acepta.
async function api(fn,args){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args,token:TOKEN})});
  const j=await r.json();
  if(!j.ok){ const e=new Error(j.error||'Error'); e.code=j.code; throw e; }
  return j.data;
}
// Compatibilidad con el código de la Mesa, que habla con google.script.run.
function makeRunner(){
  let ok=()=>{}, bad=()=>{};
  const p=new Proxy({},{get:(_,k)=>{
    if(k==='withSuccessHandler') return f=>{ok=f;return p};
    if(k==='withFailureHandler') return f=>{bad=f;return p};
    return (...args)=>{ api(k,args).then(ok,e=>{ if(e.code==='AUTH') relogin(); bad(e); }); };
  }});
  return p;
}
function relogin(){ TOKEN=null; document.querySelectorAll('.toast').forEach(t=>t.remove()); showGate('Tu sesión venció. Entra de nuevo.'); }

async function onCredential(resp){
  TOKEN=resp.credential; $('gate-err').textContent='';
  if(started){ $('gate').hidden=true; return; }
  try{ const b=await api('boot',[BOARD]); start(b); }
  catch(e){ TOKEN=null; $('gate-err').textContent=e.message; if(e.code==='AUTH'||e.code==='ACCESS'){ try{google.accounts.id.disableAutoSelect();}catch(_){} } }
}
function start(b){
  started=true; $('gate').hidden=true;
  document.title=b.title+' · Mesa de trabajo JL';
  document.getElementById('login-css').remove();
  const st=document.createElement('style'); st.textContent=b.css; document.head.append(st);
  const root=document.createElement('div'); root.innerHTML=b.body; document.body.append(...root.childNodes);
  window.BOOT=b.boot;
  window.google=window.google||{}; window.google.script={get run(){return makeRunner();}};
  const sc=document.createElement('script'); sc.textContent='const BOOT=window.BOOT;\n'+b.engine; document.body.append(sc);
}
function initGoogle(){
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,auto_select:true,cancel_on_tap_outside:false});
  google.accounts.id.renderButton($('gbtn'),{theme:'filled_black',size:'large',text:'signin_with',shape:'pill',locale:'es'});
  google.accounts.id.prompt();
}
if(window.MESA_TEST){ onCredential({credential:window.MESA_TEST}); }
else{
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.onload=initGoogle;
  s.onerror=()=>showGate('No se pudo cargar el inicio de sesión de Google. Revisa tu conexión.');
  document.head.append(s);
}
</script></body></html>
